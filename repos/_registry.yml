version: 1
organization: nazareth-depinte
repositories:
  - name: municipal-website
    visibility: private
    local: repos/municipal-website
    remote: https://github.com/nazareth-depinte/municipal-website.git
    preview: http://127.0.0.1:4328/
    deployment: https://website.nazarethdepinte.net/
    purpose: Zelfstandige Astro-website met contentcollecties en agenda. Werkend onafhankelijk testprototype achter Cloudflare Access; geen officiële dienstverlening.
    data_classification: public-source-content-in-private-development-repository
    owner: public-digital-platform
  - name: municipal-governance-workspace
    visibility: public
    local: .
    remote: https://github.com/nazareth-depinte/municipal-governance-workspace.git
    purpose: Municipal architecture, public knowledge, participation, repository registry, and human interface.
    data_classification: public
    owner: experimental-steering-group
  - name: municipal-official-operations
    visibility: private
    local: repos/official-operations
    remote: https://github.com/nazareth-depinte/municipal-official-operations.git
    purpose: Internal coordination, draft matters, restricted operational metadata, and protected-system references.
    data_classification: official-use-only
    owner: authorized-government-operators
  - name: municipal-oversight
    visibility: public
    local: repos/oversight
    remote: https://github.com/nazareth-depinte/municipal-oversight.git
    purpose: Audit findings, algorithm register, impact assessments, incidents, and remediation tracking.
    data_classification: public-with-redaction-gate
    owner: independent-oversight
  - name: municipal-service-platform
    visibility: public
    local: repos/service-platform
    remote: https://github.com/nazareth-depinte/municipal-service-platform.git
    preview: http://127.0.0.1:4328/meldpunt/
    deployment: https://website.nazarethdepinte.net/meldpunt/
    purpose: Herbruikbare dienstcode, met de zelfstandige meldpuntdemo in apps/meldpunt geïntegreerd in de Astro-website. Uitsluitend synthetische demodata; geen burgergegevens of secrets.
    data_classification: public
    owner: public-digital-platform
